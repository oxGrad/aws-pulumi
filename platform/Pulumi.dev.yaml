          weight: 4
          base: 0
      services:
        - name: esimtools
          public: true
          hosts:
            - dev-esimtools.bookcabin.com
          paths:
            - /*
          priority: 1020
          port: 3000
        - name: ota-bc-ui
          public: true
          hosts:
            - dev-aws-v3.bookcabin.com
          paths:
            - /*
          priority: 800
          port: 3000
    - name: backend
      publicListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:626883896657:listener/app/alb-public-dev/3058638beebb0b05/38fe39d69bb93911
      privateListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:626883896657:listener/app/alb-private-dev/881aa8428c606707/539f0089fb48f000
      capacityProviderStrategies:
        - capacityProvider: FARGATE_SPOT
          weight: 4
          base: 1
