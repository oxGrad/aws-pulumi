encryptionsalt: v1:BS1G8tE0UFY=:v1:oAsmdTmrDImB33KH:4WD41H6g8vdlTjJ4sqIgHhIhgjaZJw==
config:
  aws:region: ap-southeast-1
  network:vpcId: vpc-04b31b9fabf5f0eec
  cluster:serviceConnect:
    - dev.internal
  cluster:clusters:
    - name: frontend
      shortName: fe
      publicListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:123456789012:listener/app/alb-public-dev/3058638beebb0b05/38fe39d69bb93911
      privateListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:123456789012:listener/app/alb-private-dev/881aa8428c606707/539f0089fb48f000
      capacityProviderStrategies:
        - capacityProvider: FARGATE
          weight: 1
          base: 1
        - capacityProvider: FARGATE_SPOT
          weight: 4
          base: 0
      services:
        - name: esimtools
          public: true
          # hosts:
          #   - dev-aws.example.com
          # paths:
          #   - /esim/voucher/*
          # stripPathPrefix: true
          hosts:
            - dev-esimtools.example.com
          paths:
            - /*
          priority: 1020
          port: 3000
        - name: app-frontend
          public: true
          hosts:
            - dev-aws-v3.example.com
          paths:
            - /*
          priority: 800
          port: 3000
    - name: backend
      shortName: be
      publicListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:123456789012:listener/app/alb-public-dev/3058638beebb0b05/38fe39d69bb93911
      privateListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:123456789012:listener/app/alb-private-dev/881aa8428c606707/539f0089fb48f000
      capacityProviderStrategies:
        - capacityProvider: FARGATE
          weight: 1
          base: 0
        - capacityProvider: FARGATE_SPOT
          weight: 4
          base: 1
      services:
        - name: app-sandbox
          public: true
          hosts:
            - devapiaws.example.com
          paths:
            - /app-sandbox/*
          HealthCheckPath: /api/ping
          stripPathPrefix: true
          priority: 1021
          port: 8080
          autoscaling:
            minCount: 1
            maxCount: 3
            cpuTarget: 60
            memoryTarget: 60
          monitoring:
            enabled: true
            logGroupName: /ecs/app-sandbox-dev
            unhandledLogPattern: "ERROR"
            latencySLASecs: 2.0
            desiredTaskCount: 1
            minHealthyHosts: 1
            cpuAlarmThreshold: 80
            memoryAlarmThreshold: 80
        - name: app-travel
          public: true
          hosts:
            - devapiaws.example.com
          paths:
            - /app-travel/*
          HealthCheckPath: /health
          stripPathPrefix: true
          priority: 999
          port: 8080
          autoscaling:
            minCount: 1
            maxCount: 3
            cpuTarget: 60
            memoryTarget: 60
          monitoring:
            enabled: true
            logGroupName: /ecs/app-travel-dev
            unhandledLogPattern: "ERROR"
            latencySLASecs: 2.0
            desiredTaskCount: 1
            minHealthyHosts: 1
            cpuAlarmThreshold: 80
            memoryAlarmThreshold: 80
        - name: managebooking
          public: true
          hosts:
            - devapiaws.example.com
          paths:
            - /managebooking/*
          HealthCheckPath: /ping
          stripPathPrefix: false # TODO: check this
          priority: 1012
          port: 8080
        - name: pkfare-flight
          public: true
          hosts:
            - devapiaws.example.com
          paths:
            - /pkfare-flight/*
          HealthCheckPath: /api/Search/HealthCheck
          stripPathPrefix: true
          priority: 1022
          port: 8080
          s3Buckets:
            - st-ibe-pkfareflight-dev-apse1-01
          autoscaling:
            minCount: 1
            maxCount: 3
            cpuTarget: 60
            memoryTarget: 60
          monitoring:
            enabled: true
            logGroupName: /ecs/pkfare-flight-dev
            unhandledLogPattern: "ERROR"
            latencySLASecs: 2.0
            desiredTaskCount: 1
            minHealthyHosts: 1
            cpuAlarmThreshold: 80
            memoryAlarmThreshold: 80
        - name: cithotel-search
          public: false
          hosts:
            - cithotel-search-dev.internal.example.com
