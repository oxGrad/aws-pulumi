parameters:
  - name: stack
    displayName: Pulumi Stack
    type: string
    values:
      - shared
      - dev
      - stag
      - prod

trigger: none

pr:
  branches:
    include:
      - master

variables:
  - group: pulumi
  - name: PULUMI_HOME
    value: $(Pipeline.Workspace)/.pulumi
  - name: GOPATH
    value: $(Pipeline.Workspace)/go
  - name: PULUMI_EXECUTOR_ROLE
    value: pulumi-executor
  - name: SESSION_TOKEN_LIFETIME
    value: "900"

stages:
  - stage: Preview
    displayName: Pulumi Preview
    jobs:
      - job: PulumiPreview
        displayName: Preview changes
        pool:
          vmImage: ubuntu-latest
        container: pulumi/pulumi-go:3.239.0
        steps:
          - checkout: self

          - script: aws --version
            displayName: "Check AWS CLI Version"
            target: host

          - script: |
              CREDS=$(aws sts assume-role \
                --role-arn "arn:aws:iam::$(AWS_ACCOUNT_ID):role/$(PULUMI_EXECUTOR_ROLE)" \
                --role-session-name "pulumi-pipeline-$(Build.BuildId)" \
                --duration-seconds $(SESSION_TOKEN_LIFETIME) \
                --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
                --output text)

              echo "##vso[task.setvariable variable=AWS_ACCESS_KEY_ID;issecret=true]$(echo $CREDS | awk '{print $1}')"
              echo "##vso[task.setvariable variable=AWS_SECRET_ACCESS_KEY;issecret=true]$(echo $CREDS | awk '{print $2}')"
              echo "##vso[task.setvariable variable=AWS_SESSION_TOKEN;issecret=true]$(echo $CREDS | awk '{print $3}')"
            displayName: Assume pulumi-executor role
            target: host
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_REGION: $(AWS_REGION)

          - script: |
              passphrase_var="PULUMI_CONFIG_PASSPHRASE_${{ parameters.stack }}"
              export PULUMI_CONFIG_PASSPHRASE="${!passphrase_var}"
              cd platform
              if ! pulumi stack select "${{ parameters.stack }}" --non-interactive; then
                echo "##[error]Stack '${{ parameters.stack }}' does not exist."
                exit 1
              fi
            displayName: Validate stack exists
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_REGION: $(AWS_REGION)
              PULUMI_CONFIG_PASSPHRASE_dev: $(PULUMI_CONFIG_PASSPHRASE_dev)
              PULUMI_CONFIG_PASSPHRASE_stag: $(PULUMI_CONFIG_PASSPHRASE_stag)
              PULUMI_CONFIG_PASSPHRASE_prod: $(PULUMI_CONFIG_PASSPHRASE_prod)
              PULUMI_CONFIG_PASSPHRASE_shared: $(PULUMI_CONFIG_PASSPHRASE_shared)

          - script: |
              passphrase_var="PULUMI_CONFIG_PASSPHRASE_${{ parameters.stack }}"
              export PULUMI_CONFIG_PASSPHRASE="${!passphrase_var}"
              cd platform
              pulumi preview --stack "${{ parameters.stack }}" --non-interactive --diff
            displayName: Pulumi Preview
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_REGION: $(AWS_REGION)
              PULUMI_CONFIG_PASSPHRASE_dev: $(PULUMI_CONFIG_PASSPHRASE_dev)
              PULUMI_CONFIG_PASSPHRASE_stag: $(PULUMI_CONFIG_PASSPHRASE_stag)
              PULUMI_CONFIG_PASSPHRASE_prod: $(PULUMI_CONFIG_PASSPHRASE_prod)
              PULUMI_CONFIG_PASSPHRASE_shared: $(PULUMI_CONFIG_PASSPHRASE_shared)

  - stage: Apply
    displayName: Pulumi Apply
    dependsOn: Preview
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: PulumiApply
        displayName: Apply changes
        pool:
          vmImage: ubuntu-latest
        container: pulumi/pulumi-go:3.239.0
        environment: pulumi-apply
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: aws --version
                  displayName: "Check AWS CLI Version"
                  target: host

                - script: |
                    CREDS=$(aws sts assume-role \
                      --role-arn "arn:aws:iam::$(AWS_ACCOUNT_ID):role/$(PULUMI_EXECUTOR_ROLE)" \
                      --role-session-name "pulumi-pipeline-$(Build.BuildId)" \
                      --duration-seconds $(SESSION_TOKEN_LIFETIME) \
                      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
                      --output text)

                    echo "##vso[task.setvariable variable=AWS_ACCESS_KEY_ID;issecret=true]$(echo $CREDS | awk '{print $1}')"
                    echo "##vso[task.setvariable variable=AWS_SECRET_ACCESS_KEY;issecret=true]$(echo $CREDS | awk '{print $2}')"
                    echo "##vso[task.setvariable variable=AWS_SESSION_TOKEN;issecret=true]$(echo $CREDS | awk '{print $3}')"
                  displayName: Assume pulumi-executor role
                  target: host
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_REGION: $(AWS_REGION)

                - script: |
                    passphrase_var="PULUMI_CONFIG_PASSPHRASE_${{ parameters.stack }}"
                    export PULUMI_CONFIG_PASSPHRASE="${!passphrase_var}"
                    cd platform
                    pulumi up --stack "${{ parameters.stack }}" --yes --non-interactive
                  displayName: Pulumi Up
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
                    AWS_REGION: $(AWS_REGION)
                    PULUMI_CONFIG_PASSPHRASE_dev: $(PULUMI_CONFIG_PASSPHRASE_dev)
                    PULUMI_CONFIG_PASSPHRASE_stag: $(PULUMI_CONFIG_PASSPHRASE_stag)
                    PULUMI_CONFIG_PASSPHRASE_prod: $(PULUMI_CONFIG_PASSPHRASE_prod)
                    PULUMI_CONFIG_PASSPHRASE_shared: $(PULUMI_CONFIG_PASSPHRASE_shared)
