config:
  aws:region: ap-southeast-1
  network:vpcId: vpc-04b31b9fabf5f0eec
  cluster:serviceConnect:
    - prod.internal
  cluster:clusters:
    - name: frontend
      shortName: fe
      publicListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:626883896657:listener/app/alb-public-prd-ibe-01/7cd642592ad7e058/bf5451adc14c2f8b
      privateListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:626883896657:listener/app/alb-private-prd-ibe-01/f318ddae9f3ac537/fd79817d6b64c9d6
      capacityProviderStrategies:
        - capacityProvider: FARGATE
          weight: 1
          base: 1
        - capacityProvider: FARGATE_SPOT
          weight: 0
          base: 0
      services:
        - name: esimtools
          public: true
          hosts:
            - esimvoucher.bookcabin.com
          paths:
            - /*
          priority: 8
          port: 3000
    - name: backend
      shortName: be
      publicListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:626883896657:listener/app/alb-public-prd-ibe-01/7cd642592ad7e058/bf5451adc14c2f8b # alb-public-prd-ibe-01
      privateListenerARN: arn:aws:elasticloadbalancing:ap-southeast-1:626883896657:listener/app/alb-private-prd-ibe-02/6b0498e616ae28a1/a180f7d97dc83f42 # alb-private-prd-ibe-02
      capacityProviderStrategies:
        - capacityProvider: FARGATE
          weight: 1
          base: 1
        - capacityProvider: FARGATE_SPOT
          weight: 0
          base: 0
      services:
        - name: gobc-sandbox
          public: true
          hosts:
            - api-ibe.bookcabin.com
          paths:
            - /gobc-sandbox/*
          HealthCheckPath: /api/ping
          stripPathPrefix: true
          priority: 1021
          port: 8080
        - name: gobc-travel
          public: true
          hosts:
            - api-ibe.bookcabin.com
          paths:
            - /gobc-travel/*
          HealthCheckPath: /health
          stripPathPrefix: true
          priority: 50
          port: 8080
